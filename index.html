<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Apprentice</title>
<style>
*{box-sizing:border-box}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  min-height:100vh;
  overflow:hidden;
}

.pointer{
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
  width:22px;
  height:26px;
  pointer-events:none;
  opacity:0;
  transform:translate3d(-50%,0,0) scale(1);
  transform-origin:50% 8%;
  will-change:transform,opacity;
  transition:
    opacity 90ms ease-out,
    scale 90ms ease-out;
}

.pointer[data-visible="true"]{opacity:1}
.pointer[data-pressed="true"]{scale:.9}

.pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

@media (hover:hover) and (pointer:fine){
  html,
  body{cursor:none}
}

@media (hover:none),(pointer:coarse){
  .pointer{display:none}
}

@media (prefers-reduced-motion:reduce){
  .pointer{transition:none}
}
</style>
</head>
<body>
<div class="pointer" id="pointer" aria-hidden="true">
  <svg viewBox="0 0 22 26" role="presentation" focusable="false">
    <path
      d="M11 1.25
         C11.7 1.25 12.25 1.68 12.58 2.37
         L20.45 19.25
         C20.93 20.28 20.2 21.45 19.05 21.45
         L2.95 21.45
         C1.8 21.45 1.07 20.28 1.55 19.25
         L9.42 2.37
         C9.75 1.68 10.3 1.25 11 1.25
         Z"
      fill="#fff"
    />
  </svg>
</div>

<script>
const pointer=document.querySelector("#pointer");
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");

function movePointer(event){
  if(!finePointer.matches)return;
  pointer.style.left=`${event.clientX}px`;
  pointer.style.top=`${event.clientY}px`;
  pointer.dataset.visible="true";
}

window.addEventListener("pointermove",movePointer,{passive:true});
window.addEventListener("pointerenter",movePointer,{passive:true});
window.addEventListener("pointerleave",()=>{
  pointer.dataset.visible="false";
});
window.addEventListener("pointerdown",()=>{
  if(finePointer.matches)pointer.dataset.pressed="true";
});
window.addEventListener("pointerup",()=>{
  pointer.dataset.pressed="false";
});
window.addEventListener("pointercancel",()=>{
  pointer.dataset.pressed="false";
});
</script>
</body>
</html>
