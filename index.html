<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Apprentice</title>
<style>
:root{
  --canvas:#f2efe6;
  --ink:#3d372f;
  --muted:#756d61;
  --faint:#a69c8e;
  --line:rgba(61,55,47,.18);
  --paper:rgba(242,239,230,.88);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --motion-pointer-enter:70ms;
  --motion-pointer-exit:50ms;
  --motion-pointer-wobble:150ms;
  --motion-zoom:120ms;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--canvas);
}
body{
  position:relative;
  color:var(--ink);
  font-family:var(--font);
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
#game{
  position:fixed;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  background:var(--canvas);
  image-rendering:auto;
}
.hud{
  position:fixed;
  z-index:20;
  pointer-events:none;
  color:var(--ink);
  font-size:11px;
  letter-spacing:.04em;
}
.hud-top{
  top:16px;
  left:18px;
  min-width:186px;
}
.hud-bottom{
  left:18px;
  bottom:16px;
  max-width:min(460px,calc(100vw - 36px));
}
.hud-right{
  right:18px;
  bottom:16px;
  text-align:right;
}
.hud-perf{
  top:16px;
  right:18px;
  text-align:right;
  font-size:10px;
  line-height:1.55;
  letter-spacing:.055em;
  font-variant-numeric:tabular-nums;
}
.perf-line{white-space:nowrap}
.perf-label{
  color:var(--faint);
  display:inline-block;
  min-width:36px;
}
.perf-value{color:var(--muted)}
.hud-title{
  margin:0 0 7px;
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.12em;
}
.hud-row{
  display:flex;
  align-items:baseline;
  gap:12px;
  min-height:20px;
}
.hud-key{
  color:var(--faint);
  min-width:34px;
}
.hud-value{
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.inspect{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:4px 12px;
  padding-top:9px;
  border-top:1px solid var(--line);
}
.inspect-label{color:var(--faint)}
.inspect-value{color:var(--muted)}
.hint{
  color:var(--faint);
  font-size:10px;
  line-height:1.8;
  letter-spacing:.05em;
}
.zoom-flash{
  position:fixed;
  z-index:21;
  left:50%;
  top:18px;
  translate:-50% 0;
  padding:6px 9px;
  color:var(--muted);
  background:var(--paper);
  border:1px solid var(--line);
  font-size:10px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.08em;
  opacity:0;
  pointer-events:none;
  transition:
    opacity 100ms var(--ease-out),
    transform var(--motion-zoom) var(--ease-out);
  transform:translateY(-3px);
}
.zoom-flash[data-visible="true"]{
  opacity:1;
  transform:translateY(0);
}
.pointer{
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
  width:32px;
  height:32px;
  pointer-events:none;
  opacity:0;
  transform:translate3d(-2.8px,-2.5px,0);
  will-change:transform,opacity;
  transition:opacity var(--motion-pointer-exit) cubic-bezier(.4,0,1,1);
}
.pointer[data-visible="true"]{
  opacity:1;
  transition-duration:var(--motion-pointer-enter);
  transition-timing-function:var(--ease-out);
}
.pointer-shape{
  display:block;
  width:100%;
  height:100%;
  transform-origin:2.8px 2.5px;
  will-change:transform;
}
.pointer-shape.is-wobbling{
  animation:pointer-wobble var(--motion-pointer-wobble) var(--ease-out);
}
@keyframes pointer-wobble{
  0%{transform:rotate(0deg)}
  22%{transform:rotate(-4.5deg)}
  47%{transform:rotate(3.2deg)}
  70%{transform:rotate(-1.8deg)}
  86%{transform:rotate(.8deg)}
  100%{transform:rotate(0deg)}
}
.pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  filter:
    drop-shadow(0 1px .7px rgba(92,62,41,.20))
    drop-shadow(0 2px 2px rgba(92,62,41,.05));
}
@media (hover:hover) and (pointer:fine){
  html,body,#game{cursor:none}
}
@media (hover:none),(pointer:coarse){
  .pointer{display:none}
  .hint{display:none}
}
@media (max-width:640px){
  .hud-top{top:12px;left:12px}
  .hud-bottom{left:12px;bottom:12px}
  .hud-right{right:12px;bottom:12px}
  .hud-perf{top:12px;right:12px}
  .hud-title{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .pointer,.zoom-flash{transition:none}
  .pointer-shape.is-wobbling{animation:none}
}
</style>
</head>
<body>
<canvas id="game" aria-label="俯视格子地图"></canvas>

<div class="hud hud-top" aria-hidden="true">
  <h1 class="hud-title">青苔村外</h1>
  <div class="hud-row"><span class="hud-key">位置</span><span class="hud-value" id="coord">12, 14</span></div>
  <div class="hud-row"><span class="hud-key">朝向</span><span class="hud-value" id="facing">南</span></div>
  <div class="hud-row"><span class="hud-key">探索</span><span class="hud-value" id="exploration">0%</span></div>
</div>

<div class="hud hud-perf" aria-hidden="true">
  <div class="perf-line"><span class="perf-label">FPS</span> <span class="perf-value" id="perf-fps">--</span></div>
  <div class="perf-line"><span class="perf-label">AVG</span> <span class="perf-value" id="perf-avg">--</span></div>
  <div class="perf-line"><span class="perf-label">P95</span> <span class="perf-value" id="perf-p95">--</span></div>
  <div class="perf-line"><span class="perf-label">DRAW</span> <span class="perf-value" id="perf-draw">--</span></div>
</div>
<pre id="perf-report" hidden></pre>

<div class="hud hud-bottom" aria-hidden="true">
  <div class="inspect">
    <span class="inspect-label">查看</span><span class="inspect-value" id="inspect-name">草地</span>
    <span class="inspect-label">坐标</span><span class="inspect-value" id="inspect-coord">—</span>
  </div>
</div>

<div class="hud hud-right hint" aria-hidden="true">
  WASD / 方向键　移动<br>
  左键　寻路　·　右键　查看<br>
  滚轮　缩放镜头
</div>

<div class="zoom-flash" id="zoom-flash" aria-hidden="true">100%</div>

<div class="pointer" id="pointer" aria-hidden="true">
  <span class="pointer-shape" id="pointer-shape">
  <svg viewBox="0 0 32 32" role="presentation" focusable="false">
    <defs>
      <path id="tenonShape"
        d="M4.50 1.65 C3.18 1.31 2.02 2.18 1.98 3.48
           L3.80 21.76 C3.96 23.44 4.95 24.84 6.50 25.50
           L21.64 29.48 C23.38 29.93 25.17 29.13 25.97 27.52
           L29.72 19.68 C30.41 18.25 30.10 16.52 28.91 15.47
           L6.30 2.32 C5.78 2.01 5.09 1.77 4.50 1.65 Z"/>
      <clipPath id="tenonClip"><use href="#tenonShape"/></clipPath>
      <linearGradient id="warmTint" x1="2" y1="2" x2="29" y2="29" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffe0b0" stop-opacity=".62"/>
        <stop offset=".28" stop-color="#e2ac77" stop-opacity=".34"/>
        <stop offset=".62" stop-color="#a66f48" stop-opacity=".05"/>
        <stop offset="1" stop-color="#805139" stop-opacity=".10"/>
      </linearGradient>
      <linearGradient id="chamferTop" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff1d2" stop-opacity=".72"/>
        <stop offset=".42" stop-color="#eabf88" stop-opacity=".24"/>
        <stop offset="1" stop-color="#7a4d2f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="chamferDark" x1="8" y1="8" x2="29" y2="29" gradientUnits="userSpaceOnUse">
        <stop offset=".38" stop-color="#6f4932" stop-opacity="0"/>
        <stop offset=".76" stop-color="#7d5136" stop-opacity=".07"/>
        <stop offset="1" stop-color="#5b3926" stop-opacity=".18"/>
      </linearGradient>
      <filter id="textureLift" x="-10%" y="-10%" width="120%" height="120%">
        <feComponentTransfer>
          <feFuncR type="linear" slope=".78" intercept=".22"/>
          <feFuncG type="linear" slope=".80" intercept=".18"/>
          <feFuncB type="linear" slope=".82" intercept=".14"/>
        </feComponentTransfer>
      </filter>
      <filter id="microRelief" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency=".16 .52" numOctaves="2" seed="9" result="grain"/>
        <feColorMatrix in="grain" type="matrix"
          values=".18 0 0 0 .06 .08 0 0 0 .02 .03 0 0 0 .01 0 0 0 .16 0"
          result="grainTint"/>
        <feBlend in="SourceGraphic" in2="grainTint" mode="multiply"/>
      </filter>
    </defs>
    <g clip-path="url(#tenonClip)">
      <rect width="32" height="32" fill="#bd8357"/>
      <image
        href="https://cdn.polyhaven.com/asset_img/thumbs/fine_grained_wood.png?height=256&amp;quality=95"
        x="-8" y="-4" width="54" height="40"
        preserveAspectRatio="xMidYMid slice"
        opacity=".72" filter="url(#textureLift)"
        transform="rotate(27 16 16)"
      />
      <rect width="32" height="32" fill="url(#warmTint)"/>
      <rect width="32" height="32" fill="url(#chamferTop)"/>
      <rect width="32" height="32" fill="url(#chamferDark)"/>
      <rect width="32" height="32" filter="url(#microRelief)" opacity=".16"/>
      <path d="M1.6 8 C7.1 6.2 12.8 8.3 18.2 10.7 S27 13.3 32 11.4"
        fill="none" stroke="#f0c893" stroke-opacity=".22" stroke-width=".62" stroke-linecap="round"/>
      <path d="M1 14.6 C6.9 12.7 12.3 15.4 18 17 S26 20 31.4 18.1"
        fill="none" stroke="#795036" stroke-opacity=".22" stroke-width=".70" stroke-linecap="round"/>
      <path d="M2.7 21.5 C8.5 19.7 13.7 22 19.2 23.8 S25.6 26.3 29 25.4"
        fill="none" stroke="#e0aa70" stroke-opacity=".20" stroke-width=".58" stroke-linecap="round"/>
      <ellipse cx="19.9" cy="18.9" rx="3.8" ry="2.3" transform="rotate(27 19.9 18.9)"
        fill="#734a31" fill-opacity=".12"/>
      <ellipse cx="19.9" cy="18.9" rx="2.15" ry="1.18" transform="rotate(27 19.9 18.9)"
        fill="none" stroke="#e4ad73" stroke-opacity=".20" stroke-width=".50"/>
    </g>
    <use href="#tenonShape" fill="none" stroke="#765039" stroke-width=".84" stroke-linejoin="round"/>
    <path d="M4.72 2.77 C3.93 2.57 3.24 3.10 3.24 3.91
             L4.86 20.98 C4.96 22.07 5.64 22.94 6.63 23.40 L21.02 27.20"
      fill="none" stroke="#f1cc98" stroke-opacity=".48" stroke-width=".62" stroke-linecap="round"/>
    <path d="M27.88 16.54 C28.58 17.18 28.75 18.13 28.32 19.03
             L24.64 26.73 C24.21 27.60 23.31 28.05 22.35 27.81"
      fill="none" stroke="#65432f" stroke-opacity=".34" stroke-width=".72" stroke-linecap="round"/>
  </svg>
  </span>
</div>

<script>
const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");
const coordEl=document.querySelector("#coord");
const facingEl=document.querySelector("#facing");
const explorationEl=document.querySelector("#exploration");
const inspectNameEl=document.querySelector("#inspect-name");
const inspectCoordEl=document.querySelector("#inspect-coord");
const zoomFlash=document.querySelector("#zoom-flash");
const perfFpsEl=document.querySelector("#perf-fps");
const perfAvgEl=document.querySelector("#perf-avg");
const perfP95El=document.querySelector("#perf-p95");
const perfDrawEl=document.querySelector("#perf-draw");
const perfReportEl=document.querySelector("#perf-report");
const pointer=document.querySelector("#pointer");
const pointerShape=document.querySelector("#pointer-shape");
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const query=new URLSearchParams(location.search);
const visualCheck=query.has("visual-check");
const perfCheck=query.has("perf-check");

const MAP_W=36;
const MAP_H=28;
const BASE_TILE=40;
const STATIC_CACHE_SCALE=2;
const RENDER_DPR_MAX=1.5;
const ZOOM_MIN=.72;
const ZOOM_MAX=1.65;
const MOVE_MS=reduceMotion.matches?0:115;
const VISION_CLEAR_RADIUS=4.25;
const VISION_MAX_RADIUS=6.25;
const FOG_SEEN_ALPHA=.64;
const FOG_GLITCH_CELLS=8;
const FOG_GLITCH_BLOCKS=9;
const FOG_TRANSITION_MS=220;
const FOG_PULSE_MIN_MS=3800;
const FOG_PULSE_MAX_MS=6800;
const FOG_CELL_PULSE_AMPLITUDE=.016;
const FOG_BLOCK_PULSE_AMPLITUDE=.028;
const FOG_GLITCH_VARIANCE=.045;
const FOG_TEXTURE_INTERVAL_MS=1000/30;
const FOG_TEX_W=MAP_W*FOG_GLITCH_CELLS;
const FOG_TEX_H=MAP_H*FOG_GLITCH_CELLS;
const PERF_UPDATE_MS=250;
const PERF_SAMPLE_LIMIT=240;
const PERF_SLOW_FRAME_MS=20;

const TILE_INFO={
  field:{name:"荒草地",walkable:true},
  grass:{name:"湿草地",walkable:true},
  mud:{name:"泥地",walkable:true},
  path:{name:"车辙土路",walkable:true},
  puddle:{name:"积水",walkable:true},
  water:{name:"浅川",walkable:false},
  tree:{name:"密林",walkable:false},
  bush:{name:"荆丛",walkable:false},
  stump:{name:"树桩",walkable:false},
  log:{name:"倒木",walkable:false},
  stone:{name:"石块",walkable:false},
  flower:{name:"野花",walkable:true},
  bridge:{name:"旧木桥",walkable:true},
  fence:{name:"木篱",walkable:false},
  cart:{name:"破车",walkable:false},
  ruin:{name:"残垣",walkable:false},
  shrine:{name:"路祠",walkable:false},
  house:{name:"民家",walkable:false}
};

const map=Array.from({length:MAP_H},()=>Array(MAP_W).fill("field"));

function setTile(x,y,type){
  if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H)map[y][x]=type;
}

function setRoadTile(x,y){
  const current=tileAt(x,y);
  setTile(x,y,current==="water"?"bridge":"path");
}

function buildMap(){
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      const broad=hash(Math.floor(x/3),Math.floor(y/3),211);
      const fine=hash(x,y,223);
      setTile(x,y,broad*.68+fine*.32>.54?"grass":"field");
    }
  }

  // Meandering river on the eastern third.
  for(let y=1;y<MAP_H-1;y++){
    const riverX=28+Math.round(Math.sin(y*.42)*1.45+Math.sin(y*.17)*.55);
    setTile(riverX,y,"water");
    setTile(riverX+1,y,"water");
    if(y%5===1&&riverX-1>0)setTile(riverX-1,y,"mud");
  }

  // Main road: a broad east-west route with subtle bends.
  const mainRoad=[];
  for(let x=2;x<MAP_W-2;x++){
    const y=16+Math.round(Math.sin((x-12)*.31)*1.15);
    mainRoad.push([x,y]);
    setRoadTile(x,y);

    if(tileAt(x,y-1)!=="water"&&hash(x,y,301)>.38)setTile(x,y-1,"mud");
    if(tileAt(x,y+1)!=="water"&&hash(x,y,307)>.44)setTile(x,y+1,"mud");
  }

  // North branch into the hamlet.
  for(let y=6;y<=16;y++){
    const x=12+Math.round(Math.sin((y-9)*.55)*.75);
    setRoadTile(x,y);
    if(y<15&&tileAt(x+1,y)!=="water"&&hash(x,y,313)>.52)setTile(x+1,y,"mud");
  }

  // Western fork and a short track toward the ruined roadside site.
  for(let step=0;step<10;step++){
    const x=12-step;
    const y=12-Math.round(step*.48);
    setRoadTile(x,y);
  }
  for(let step=0;step<8;step++){
    const x=20+step;
    const y=17+Math.round(step*.32);
    setRoadTile(x,y);
  }

  // Muddy hamlet yards.
  for(let y=6;y<=11;y++){
    for(let x=7;x<=17;x++){
      if(tileAt(x,y)==="field"||tileAt(x,y)==="grass"){
        const yard=hash(x,y,337);
        if(yard>.34)setTile(x,y,yard>.78?"puddle":"mud");
      }
    }
  }

  // Houses are deliberately offset from the road, leaving small yards.
  [[8,7],[15,8],[9,10]].forEach(([x,y])=>setTile(x,y,"house"));
  [[7,8],[7,9],[16,9],[17,9],[8,11],[9,11]].forEach(([x,y])=>{
    if(tileAt(x,y)!=="path")setTile(x,y,"fence");
  });
  setTile(6,9,"cart");
  setTile(17,7,"stump");

  // Roadside ruin / shrine cluster.
  setTile(21,15,"shrine");
  setTile(22,14,"ruin");
  setTile(23,14,"ruin");
  setTile(23,15,"log");
  setTile(20,14,"stone");

  // Dense forest edge and irregular interior copses.
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      const type=tileAt(x,y);
      if(!["field","grass","mud"].includes(type))continue;

      const edge=Math.min(x,y,MAP_W-1-x,MAP_H-1-y);
      const cluster=
        hash(Math.floor((x+2)/4),Math.floor((y+1)/4),401)*.56+
        hash(x,y,409)*.44;
      const threshold=edge<=1?.18:edge===2?.42:edge===3?.68:.90;

      const nearRoad=
        tileAt(x-1,y)==="path"||tileAt(x+1,y)==="path"||
        tileAt(x,y-1)==="path"||tileAt(x,y+1)==="path"||
        tileAt(x-1,y)==="bridge"||tileAt(x+1,y)==="bridge";

      if(cluster>threshold&&!nearRoad){
        setTile(x,y,"tree");
      }else if(cluster>threshold-.09&&!nearRoad&&hash(x,y,431)>.60){
        setTile(x,y,"bush");
      }
    }
  }

  // Preserve border as a forest wall, except where the road leaves the map.
  for(let x=0;x<MAP_W;x++){
    if(x<2||x>MAP_W-3){
      setTile(x,0,"tree");
      setTile(x,MAP_H-1,"tree");
    }else{
      if(tileAt(x,0)!=="path")setTile(x,0,"tree");
      if(tileAt(x,MAP_H-1)!=="path")setTile(x,MAP_H-1,"tree");
    }
  }
  for(let y=0;y<MAP_H;y++){
    if(tileAt(0,y)!=="path")setTile(0,y,"tree");
    if(tileAt(MAP_W-1,y)!=="path")setTile(MAP_W-1,y,"tree");
  }

  // Clear readable breathing space around the starting crossroads.
  for(let y=14;y<=18;y++){
    for(let x=10;x<=15;x++){
      const type=tileAt(x,y);
      if(type==="tree"||type==="bush")setTile(x,y,hash(x,y,467)>.5?"field":"grass");
    }
  }

  // Scatter grounded environmental storytelling.
  const props=[
    [5,13,"stump"],[6,20,"log"],[18,12,"stone"],[19,20,"stump"],
    [24,20,"log"],[31,15,"stone"],[32,21,"stump"],[25,8,"stone"],
    [4,18,"bush"],[18,22,"bush"],[30,10,"bush"]
  ];
  props.forEach(([x,y,type])=>{
    if(["field","grass","mud"].includes(tileAt(x,y)))setTile(x,y,type);
  });

  // Small puddles and flowers live mainly in open ground.
  for(let y=3;y<MAP_H-3;y++){
    for(let x=3;x<MAP_W-3;x++){
      const type=tileAt(x,y);
      const n=hash(x,y,503);
      if((type==="field"||type==="grass")&&n>.965)setTile(x,y,"flower");
      else if(type==="mud"&&n<.10)setTile(x,y,"puddle");
    }
  }

  // Ensure the player spawn and immediate movement corridor are valid.
  setTile(12,16,"path");
  setTile(11,16,"path");
  setTile(13,16,"path");
  setTile(12,15,"path");
  setTile(12,17,"path");
}
buildMap();

const player={
  x:12,y:14,
  renderX:12,renderY:14,
  facing:"south",
  moving:false,
  fromX:12,fromY:14,
  toX:12,toY:14,
  moveStart:0,
  path:[]
};

const discovered=Array.from({length:MAP_H},()=>Array(MAP_W).fill(false));
const vision=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
const fogCurrent=Array.from({length:MAP_H},()=>Array(MAP_W).fill(1));
const fogFrom=Array.from({length:MAP_H},()=>Array(MAP_W).fill(1));
const fogTarget=Array.from({length:MAP_H},()=>Array(MAP_W).fill(1));
const OPAQUE_TILES=new Set(["tree","bush","house","shrine","ruin"]);
let fogTransitionStart=performance.now();
let fogTransitionDuration=0;
let fogTextureLastUpdate=-Infinity;
let fogTextureDirty=true;

const staticMapCanvas=document.createElement("canvas");
staticMapCanvas.width=MAP_W*BASE_TILE*STATIC_CACHE_SCALE;
staticMapCanvas.height=MAP_H*BASE_TILE*STATIC_CACHE_SCALE;
const staticMapCtx=staticMapCanvas.getContext("2d");

const fogTextureCanvas=document.createElement("canvas");
fogTextureCanvas.width=FOG_TEX_W;

const fogPulseSpeed=new Float32Array(FOG_TEX_W*FOG_TEX_H);
const fogBlockBias=new Float32Array(FOG_TEX_W*FOG_TEX_H);
const fogSampleX0=new Uint16Array(FOG_TEX_W);
const fogSampleX1=new Uint16Array(FOG_TEX_W);
const fogSampleTX=new Float32Array(FOG_TEX_W);
const fogSampleY0=new Uint16Array(FOG_TEX_H);

const perfState={
  startedAt:performance.now(),
  lastFrameAt:null,
  lastHudAt:0,
  frameTimes:[],
  drawTimes:[]
};

function clamp(value,min,max){return Math.min(max,Math.max(min,value))}

function pushPerfSample(list,value){
  list.push(value);
  if(list.length>PERF_SAMPLE_LIMIT)list.shift();
}

function average(values){
  if(!values.length)return 0;
  return values.reduce((sum,value)=>sum+value,0)/values.length;
}

function percentile(values,p){
  if(!values.length)return 0;
  const sorted=[...values].sort((a,b)=>a-b);
  const index=Math.min(sorted.length-1,Math.max(0,Math.ceil(sorted.length*p)-1));
  return sorted[index];
}

function performanceSummary(now=performance.now()){
  const frames=perfState.frameTimes;
  const draws=perfState.drawTimes;
  const recent=frames.slice(-30);
  const currentFrameMs=average(recent);
  const avgFrameMs=average(frames);
  const avgDrawMs=average(draws);
  const slowFrames=frames.filter(value=>value>PERF_SLOW_FRAME_MS).length;

  return {
    elapsedMs:Math.round(now-perfState.startedAt),
    samples:frames.length,
    fps:Number((currentFrameMs?1000/currentFrameMs:0).toFixed(1)),
    avgFps:Number((avgFrameMs?1000/avgFrameMs:0).toFixed(1)),
    avgFrameMs:Number(avgFrameMs.toFixed(2)),
    p95FrameMs:Number(percentile(frames,.95).toFixed(2)),
    avgDrawMs:Number(avgDrawMs.toFixed(2)),
    p95DrawMs:Number(percentile(draws,.95).toFixed(2)),
    slowFramePct:Number((frames.length?slowFrames/frames.length*100:0).toFixed(1)),
    viewport:`${cssWidth}x${cssHeight}@${dpr}`,
    dynamicCheck:perfCheck
  };
}

function updatePerformanceHud(now,drawMs){
  if(perfState.lastFrameAt!==null){
    const frameMs=now-perfState.lastFrameAt;
    if(frameMs>0&&frameMs<250)pushPerfSample(perfState.frameTimes,frameMs);
  }
  perfState.lastFrameAt=now;
  pushPerfSample(perfState.drawTimes,drawMs);

  if(now-perfState.lastHudAt<PERF_UPDATE_MS)return;
  perfState.lastHudAt=now;

  const summary=performanceSummary(now);
  perfFpsEl.textContent=summary.samples?summary.fps.toFixed(1):"--";
  perfAvgEl.textContent=summary.samples?summary.avgFps.toFixed(1):"--";
  perfP95El.textContent=summary.samples?`${summary.p95FrameMs.toFixed(1)}ms`:"--";
  perfDrawEl.textContent=summary.samples?`${summary.avgDrawMs.toFixed(1)}ms`:"--";

  perfReportEl.textContent=JSON.stringify(summary);
  window.__APPRENTICE_PERF__=summary;
}

function cubicBezier(x1,y1,x2,y2){
  const cx=3*x1;
  const bx=3*(x2-x1)-cx;
  const ax=1-cx-bx;
  const cy=3*y1;
  const by=3*(y2-y1)-cy;
  const ay=1-cy-by;

  const sampleX=t=>((ax*t+bx)*t+cx)*t;
  const sampleY=t=>((ay*t+by)*t+cy)*t;
  const sampleDerivativeX=t=>(3*ax*t+2*bx)*t+cx;

  return x=>{
    let t=x;
    for(let i=0;i<5;i++){
      const dx=sampleX(t)-x;
      const d=sampleDerivativeX(t);
      if(Math.abs(d)<1e-6)break;
      t=clamp(t-dx/d,0,1);
    }
    return sampleY(t);
  };
}

const easeVision=cubicBezier(.77,0,.175,1);

function hash(x,y,s=0){
  let n=x*374761393+y*668265263+s*982451653;
  n=(n^(n>>13))*1274126177;
  return ((n^(n>>16))>>>0)/4294967295;
}

function initializeFogTexturePattern(){
  const tau=Math.PI*2;

  for(let px=0;px<FOG_TEX_W;px++){
    const worldX=px/FOG_GLITCH_CELLS+.5/FOG_GLITCH_CELLS;
    const fx=clamp(worldX-.5,0,MAP_W-1);
    const x0=Math.floor(fx);
    fogSampleX0[px]=x0;
    fogSampleX1[px]=Math.min(MAP_W-1,x0+1);
    fogSampleTX[px]=fx-x0;
  }

  for(let py=0;py<FOG_TEX_H;py++){
    const worldY=py/FOG_GLITCH_CELLS+.5/FOG_GLITCH_CELLS;
    const fy=clamp(worldY-.5,0,MAP_H-1);
    const y0=Math.floor(fy);
    fogSampleY0[py]=y0;
    fogSampleY1[py]=Math.min(MAP_H-1,y0+1);
    fogSampleTY[py]=fy-y0;
  }

  for(let py=0;py<FOG_TEX_H;py++){
    for(let px=0;px<FOG_TEX_W;px++){
      const index=py*FOG_TEX_W+px;
      fogPulsePhase[index]=hash(px,py,113)*tau;
      const period=FOG_PULSE_MIN_MS+
        hash(px,py,149)*(FOG_PULSE_MAX_MS-FOG_PULSE_MIN_MS);
      fogPulseSpeed[index]=tau/period;
    }
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      for(let block=0;block<FOG_GLITCH_BLOCKS;block++){
        const seed=block*17+3;
        const gx=Math.floor(hash(x,y,seed)*FOG_GLITCH_CELLS);
        const gy=Math.floor(hash(x,y,seed+1)*FOG_GLITCH_CELLS);
        const blockW=1+Math.floor(hash(x,y,seed+2)*3);
        const blockH=1+Math.floor(hash(x,y,seed+3)*2);
        const variance=(hash(x,y,seed+6)-.5)*FOG_GLITCH_VARIANCE;
        const bias=clamp(.022+variance,0,.075);

        for(let by=0;by<blockH&&gy+by<FOG_GLITCH_CELLS;by++){
          for(let bx=0;bx<blockW&&gx+bx<FOG_GLITCH_CELLS;bx++){
            const px=x*FOG_GLITCH_CELLS+gx+bx;
            const py=y*FOG_GLITCH_CELLS+gy+by;
            const index=py*FOG_TEX_W+px;
            fogBlockBias[index]=Math.max(fogBlockBias[index],bias);
          }
        }
      }
    }
  }
}

function resize(){
  cssWidth=innerWidth;
  cssHeight=innerHeight;
  dpr=Math.min(devicePixelRatio||1,RENDER_DPR_MAX);
  canvas.width=Math.round(cssWidth*dpr);
  canvas.height=Math.round(cssHeight*dpr);
  canvas.style.width=cssWidth+"px";
  canvas.style.height=cssHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize,{passive:true});
resize();

function tileAt(x,y){
  if(x<0||y<0||x>=MAP_W||y>=MAP_H)return "tree";
  return map[y][x];
}

function canWalk(x,y){
  return TILE_INFO[tileAt(x,y)]?.walkable===true;
}

function blocksVision(x,y){
  return OPAQUE_TILES.has(tileAt(x,y));
}

function hasLineOfSight(ox,oy,tx,ty){
  if(ox===tx&&oy===ty)return true;

  let x=ox;
  let y=oy;
  const dx=Math.abs(tx-ox);
  const dy=Math.abs(ty-oy);
  const sx=ox<tx?1:-1;
  const sy=oy<ty?1:-1;
  let err=dx-dy;

  while(!(x===tx&&y===ty)){
    const twice=err*2;
    if(twice>-dy){err-=dy;x+=sx}
    if(twice<dx){err+=dx;y+=sy}

    if(x===tx&&y===ty)return true;
    if(blocksVision(x,y))return false;
  }

  return true;
}

function updateFogTransition(now=performance.now()){
  if(fogTransitionDuration<=0)return;

  const progress=clamp((now-fogTransitionStart)/fogTransitionDuration,0,1);
  const eased=easeVision(progress);

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      fogCurrent[y][x]=fogFrom[y][x]+(fogTarget[y][x]-fogFrom[y][x])*eased;
    }
  }

  fogTextureDirty=true;
  if(progress>=1)fogTransitionDuration=0;
}

function updateVision({animate=true}={}){
  const now=performance.now();
  updateFogTransition(now);

  for(let y=0;y<MAP_H;y++){
    vision[y].fill(0);
  }

  const reach=Math.ceil(VISION_MAX_RADIUS);
  for(let y=Math.max(0,player.y-reach);y<=Math.min(MAP_H-1,player.y+reach);y++){
    for(let x=Math.max(0,player.x-reach);x<=Math.min(MAP_W-1,player.x+reach);x++){
      const distance=Math.hypot(x-player.x,y-player.y);
      if(distance>VISION_MAX_RADIUS||!hasLineOfSight(player.x,player.y,x,y))continue;

      let strength=1;
      if(distance>VISION_CLEAR_RADIUS){
        strength=1-(distance-VISION_CLEAR_RADIUS)/(VISION_MAX_RADIUS-VISION_CLEAR_RADIUS);
      }

      strength=clamp(strength,0,1);
      vision[y][x]=strength;
    }
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      fogFrom[y][x]=fogCurrent[y][x];

      const strength=vision[y][x];
      if(strength>.015)discovered[y][x]=true;

      let target=1;
      if(discovered[y][x]){
        if(strength>=.999)target=0;
        else if(strength<=.001)target=FOG_SEEN_ALPHA;
        else target=FOG_SEEN_ALPHA*(1-strength);
      }
      fogTarget[y][x]=target;
    }
  }

  fogTransitionStart=now;
  fogTransitionDuration=animate&&!reduceMotion.matches?FOG_TRANSITION_MS:0;
  fogTextureDirty=true;

  if(fogTransitionDuration===0){
    for(let y=0;y<MAP_H;y++){
      for(let x=0;x<MAP_W;x++)fogCurrent[y][x]=fogTarget[y][x];
    }
  }
}

function isDiscovered(x,y){
  return x>=0&&y>=0&&x<MAP_W&&y<MAP_H&&discovered[y][x];
}

function screenToTile(clientX,clientY){
  const tileSize=BASE_TILE*zoom;
  const wx=(clientX-cssWidth/2)/tileSize+camera.x;
  const wy=(clientY-cssHeight/2)/tileSize+camera.y;
  return {x:Math.floor(wx),y:Math.floor(wy)};
}

function tileToScreen(x,y){
  const tileSize=BASE_TILE*zoom;
  return {
    x:(x-camera.x)*tileSize+cssWidth/2,
    y:(y-camera.y)*tileSize+cssHeight/2
  };
}

function roundedRect(x,y,w,h,r,target=ctx){
  const rr=Math.min(r,w/2,h/2);
  target.beginPath();
  target.moveTo(x+rr,y);
  target.arcTo(x+w,y,x+w,y+h,rr);
  target.arcTo(x+w,y+h,x,y+h,rr);
  target.arcTo(x,y+h,x,y,rr);
  target.arcTo(x,y,x+w,y,rr);
  target.closePath();
}

function drawGroundTile(type,x,y,s,target=ctx,tileX=0,tileY=0){
  const px=Math.floor(x);
  const py=Math.floor(y);
  const seed=hash(tileX,tileY,601);

  const openGround=["field","grass","flower","tree","bush","stump","log","stone","house","shrine","fence","cart","ruin"];
  if(openGround.includes(type)){
    const base=type==="grass"||seed>.58?"#667253":"#77745a";
    target.fillStyle=base;
    target.fillRect(px,py,Math.ceil(s)+1,Math.ceil(s)+1);

    for(let i=0;i<7;i++){
      const nx=hash(tileX,tileY,610+i);
      const ny=hash(tileX,tileY,630+i);
      const h=s*(.035+hash(tileX,tileY,650+i)*.055);
      target.strokeStyle=i%3===0?"rgba(183,174,126,.18)":"rgba(45,55,37,.28)";
      target.lineWidth=Math.max(.6,s*.012);
      target.beginPath();
      target.moveTo(x+nx*s,y+ny*s);
      target.lineTo(x+nx*s+s*.018,y+ny*s-h);
      target.stroke();
    }

    if(type==="field"||seed<.46){
      target.fillStyle="rgba(54,48,37,.10)";
      for(let i=0;i<3;i++){
        const rx=x+hash(tileX,tileY,680+i)*s;
        const ry=y+hash(tileX,tileY,690+i)*s;
        target.fillRect(rx,ry,Math.max(1,s*.025),Math.max(1,s*.018));
      }
    }
  }

  if(type==="mud"||type==="path"||type==="puddle"){
    const left=tileAt(tileX-1,tileY);
    const right=tileAt(tileX+1,tileY);
    const up=tileAt(tileX,tileY-1);
    const down=tileAt(tileX,tileY+1);
    const roadish=t=>t==="path"||t==="bridge";
    const horizontal=roadish(left)||roadish(right);
    const vertical=roadish(up)||roadish(down);

    if(type==="path"){
      // Underpaint the road tile with ground, then draw only the travelled corridor.
      target.fillStyle=seed>.52?"#687255":"#737158";
      target.fillRect(px,py,Math.ceil(s)+1,Math.ceil(s)+1);

      target.fillStyle="#756652";
      if(horizontal){
        target.fillRect(x-s*.02,y+s*.16,s*1.04,s*.68);
        target.fillStyle="rgba(55,47,39,.13)";
        target.fillRect(x-s*.02,y+s*.16,s*1.04,s*.055);
        target.fillRect(x-s*.02,y+s*.785,s*1.04,s*.055);
        target.fillStyle="#756652";
      }
      if(vertical){
        target.fillRect(x+s*.16,y-s*.02,s*.68,s*1.04);
        target.fillStyle="rgba(55,47,39,.13)";
        target.fillRect(x+s*.16,y-s*.02,s*.055,s*1.04);
        target.fillRect(x+s*.785,y-s*.02,s*.055,s*1.04);
        target.fillStyle="#756652";
      }
      if(!horizontal&&!vertical){
        target.fillRect(x+s*.16,y+s*.16,s*.68,s*.68);
      }

      // Pixel-cut shoulders break the rectangular silhouette.
      target.fillStyle=seed>.5?"#687255":"#737158";
      if(hash(tileX,tileY,704)>.5)target.fillRect(x,y,s*.13,s*.20);
      if(hash(tileX,tileY,705)>.5)target.fillRect(x+s*.87,y+s*.80,s*.13,s*.20);
      if(hash(tileX,tileY,706)>.62)target.fillRect(x+s*.82,y,s*.18,s*.12);
      if(hash(tileX,tileY,707)>.62)target.fillRect(x,y+s*.86,s*.18,s*.14);

      target.strokeStyle="rgba(45,38,31,.27)";
      target.lineWidth=Math.max(1,s*.032);
      if(horizontal){
        for(const yy of [.37,.64]){
          target.beginPath();
          target.moveTo(x-s*.04,y+s*yy);
          target.bezierCurveTo(
            x+s*.28,y+s*(yy-.035),
            x+s*.67,y+s*(yy+.03),
            x+s*1.04,y+s*(yy-.012)
          );
          target.stroke();
        }
      }
      if(vertical){
        for(const xx of [.37,.64]){
          target.beginPath();
          target.moveTo(x+s*xx,y-s*.04);
          target.bezierCurveTo(
            x+s*(xx-.03),y+s*.30,
            x+s*(xx+.03),y+s*.70,
            x+s*(xx-.01),y+s*1.04
          );
          target.stroke();
        }
      }
    }else{
      target.fillStyle="#625b4d";
      target.fillRect(px,py,Math.ceil(s)+1,Math.ceil(s)+1);
    }

    target.fillStyle="rgba(36,31,26,.12)";
    for(let i=0;i<3;i++){
      const rx=x+hash(tileX,tileY,720+i)*s;
      const ry=y+hash(tileX,tileY,730+i)*s;
      target.beginPath();
      target.ellipse(rx,ry,s*.035,s*.018,hash(tileX,tileY,740+i)*Math.PI,0,Math.PI*2);
      target.fill();
    }
  }

  if(type==="puddle"){
    target.fillStyle="rgba(70,91,86,.64)";
    target.beginPath();
    target.ellipse(x+s*.52,y+s*.58,s*.31,s*.17,-.12,0,Math.PI*2);
    target.fill();
    target.strokeStyle="rgba(171,184,157,.28)";
    target.lineWidth=Math.max(.7,s*.012);
    target.beginPath();
    target.moveTo(x+s*.32,y+s*.54);
    target.quadraticCurveTo(x+s*.52,y+s*.49,x+s*.72,y+s*.55);
    target.stroke();
  }

  if(type==="water"){
    target.fillStyle="#4f6b6d";
    target.fillRect(px,py,Math.ceil(s)+1,Math.ceil(s)+1);
    target.fillStyle="rgba(35,52,52,.14)";
    target.fillRect(x,y+s*.72,s+1,s*.28+1);
    target.strokeStyle="rgba(185,200,179,.30)";
    target.lineWidth=Math.max(1,s*.022);
    for(let i=0;i<3;i++){
      const yy=y+s*(.22+i*.27)+hash(tileX,tileY,760+i)*s*.05;
      target.beginPath();
      target.moveTo(x+s*.08,yy);
      target.lineTo(x+s*.30,yy-s*.025);
      target.lineTo(x+s*.51,yy+s*.012);
      target.lineTo(x+s*.78,yy-s*.018);
      target.stroke();
    }
  }

  if(type==="bridge"){
    target.fillStyle="#624a37";
    target.fillRect(px,py,Math.ceil(s)+1,Math.ceil(s)+1);
    target.strokeStyle="rgba(33,24,19,.42)";
    target.lineWidth=Math.max(1,s*.026);
    for(let i=1;i<6;i++){
      const xx=x+s*i/6;
      target.beginPath();target.moveTo(xx,y);target.lineTo(xx,y+s);target.stroke();
    }
    target.strokeStyle="rgba(202,166,111,.22)";
    target.beginPath();target.moveTo(x,y+s*.15);target.lineTo(x+s,y+s*.15);target.stroke();
    target.beginPath();target.moveTo(x,y+s*.84);target.lineTo(x+s,y+s*.84);target.stroke();
  }
}

function drawObject(type,x,y,s,target=ctx){
  const sx=hash(Math.floor(x/s),Math.floor(y/s),811);

  if(type==="tree"){
    target.fillStyle="rgba(24,27,20,.22)";
    target.beginPath();
    target.ellipse(x+s*.53,y+s*.82,s*.34,s*.12,0,0,Math.PI*2);
    target.fill();

    target.fillStyle="#513d30";
    target.fillRect(x+s*.455,y+s*.46,s*.105,s*.40);

    if(sx>.48){
      const layers=[
        [".50",".11",".34","#324a38"],
        [".50",".25",".30","#405941"],
        [".50",".38",".25","#52694a"]
      ];
      for(const [cx,cy,r,color] of layers){
        target.fillStyle=color;
        target.beginPath();
        target.moveTo(x+s*Number(cx),y-s*.16+s*Number(cy));
        target.lineTo(x+s*(Number(cx)-Number(r)),y+s*Number(cy)+s*.30);
        target.lineTo(x+s*(Number(cx)+Number(r)),y+s*Number(cy)+s*.30);
        target.closePath();
        target.fill();
      }
    }else{
      const crowns=[
        [.32,.22,.34,"#334b39"],
        [.61,.20,.31,"#3e5840"],
        [.48,.02,.30,"#526a49"],
        [.46,.34,.31,"#435d42"]
      ];
      for(const [cx,cy,r,color] of crowns){
        target.fillStyle=color;
        target.beginPath();
        target.arc(x+s*cx,y+s*cy,s*r,0,Math.PI*2);
        target.fill();
      }
    }

    target.fillStyle="rgba(171,175,126,.09)";
    target.beginPath();
    target.arc(x+s*.40,y+s*.05,s*.16,0,Math.PI*2);
    target.fill();
  }else if(type==="bush"){
    target.fillStyle="rgba(28,31,22,.15)";
    target.beginPath();target.ellipse(x+s*.50,y+s*.70,s*.30,s*.10,0,0,Math.PI*2);target.fill();
    const blobs=[
      [.31,.49,.22,"#40583d"],[.55,.43,.25,"#344a38"],[.69,.55,.20,"#536a48"]
    ];
    blobs.forEach(([cx,cy,r,c])=>{
      target.fillStyle=c;
      target.beginPath();target.arc(x+s*cx,y+s*cy,s*r,0,Math.PI*2);target.fill();
    });
  }else if(type==="stone"||type==="ruin"){
    target.fillStyle="rgba(38,34,31,.18)";
    target.beginPath();target.ellipse(x+s*.52,y+s*.76,s*.31,s*.10,0,0,Math.PI*2);target.fill();
    target.fillStyle=type==="ruin"?"#777368":"#6f746f";
    if(type==="ruin"){
      target.fillRect(x+s*.16,y+s*.37,s*.68,s*.34);
      target.fillStyle="#56544d";
      target.fillRect(x+s*.18,y+s*.34,s*.28,s*.08);
      target.fillRect(x+s*.58,y+s*.30,s*.24,s*.09);
      target.fillStyle="rgba(205,199,169,.12)";
      target.fillRect(x+s*.23,y+s*.43,s*.24,s*.05);
    }else{
      roundedRect(x+s*.20,y+s*.34,s*.60,s*.40,s*.10,target);target.fill();
      target.fillStyle="rgba(215,213,188,.20)";
      roundedRect(x+s*.29,y+s*.37,s*.32,s*.09,s*.03,target);target.fill();
    }
  }else if(type==="stump"){
    target.fillStyle="rgba(35,30,25,.17)";
    target.beginPath();target.ellipse(x+s*.51,y+s*.70,s*.22,s*.08,0,0,Math.PI*2);target.fill();
    target.fillStyle="#604733";
    target.fillRect(x+s*.38,y+s*.43,s*.25,s*.26);
    target.fillStyle="#927252";
    target.beginPath();target.ellipse(x+s*.505,y+s*.43,s*.13,s*.055,0,0,Math.PI*2);target.fill();
    target.strokeStyle="rgba(67,47,32,.55)";
    target.lineWidth=Math.max(.8,s*.015);
    target.beginPath();target.ellipse(x+s*.505,y+s*.43,s*.075,s*.03,0,0,Math.PI*2);target.stroke();
  }else if(type==="log"){
    target.save();
    target.translate(x+s*.50,y+s*.58);
    target.rotate(-.28);
    target.fillStyle="rgba(30,27,22,.18)";
    target.fillRect(-s*.34,s*.07,s*.70,s*.10);
    target.fillStyle="#5a432f";
    roundedRect(-s*.36,-s*.09,s*.72,s*.18,s*.08,target);target.fill();
    target.strokeStyle="rgba(164,125,82,.28)";
    target.lineWidth=Math.max(.8,s*.018);
    target.beginPath();target.moveTo(-s*.24,-s*.02);target.lineTo(s*.22,-s*.02);target.stroke();
    target.restore();
  }else if(type==="flower"){
    const colors=["#c3ad78","#a56f69","#d3c18c"];
    for(let i=0;i<5;i++){
      target.fillStyle=colors[i%colors.length];
      target.fillRect(
        x+s*(.20+.13*i),
        y+s*(.48+(i%2)*.12),
        Math.max(2,s*.045),
        Math.max(2,s*.045)
      );
    }
  }else if(type==="fence"){
    target.strokeStyle="#584332";
    target.lineWidth=Math.max(2,s*.07);
    target.lineCap="square";
    target.beginPath();target.moveTo(x+s*.08,y+s*.56);target.lineTo(x+s*.92,y+s*.52);target.stroke();
    target.lineWidth=Math.max(1,s*.035);
    for(const xx of [.22,.72]){
      target.beginPath();target.moveTo(x+s*xx,y+s*.30);target.lineTo(x+s*xx,y+s*.76);target.stroke();
    }
  }else if(type==="cart"){
    target.fillStyle="rgba(37,31,26,.18)";
    target.beginPath();target.ellipse(x+s*.51,y+s*.78,s*.34,s*.09,0,0,Math.PI*2);target.fill();
    target.strokeStyle="#4e392b";
    target.lineWidth=Math.max(2,s*.045);
    for(const cx of [.30,.70]){
      target.beginPath();target.arc(x+s*cx,y+s*.70,s*.16,0,Math.PI*2);target.stroke();
      target.beginPath();target.moveTo(x+s*cx,y+s*.54);target.lineTo(x+s*cx,y+s*.86);target.stroke();
    }
    target.fillStyle="#684d36";
    target.fillRect(x+s*.23,y+s*.38,s*.55,s*.26);
    target.strokeStyle="rgba(190,147,91,.24)";
    target.lineWidth=Math.max(1,s*.02);
    target.strokeRect(x+s*.28,y+s*.42,s*.45,s*.17);
  }else if(type==="house"){
    target.fillStyle="rgba(34,29,25,.22)";
    target.beginPath();target.ellipse(x+s*.52,y+s*.84,s*.48,s*.13,0,0,Math.PI*2);target.fill();

    target.fillStyle="#9b8b73";
    target.fillRect(x+s*.10,y+s*.39,s*.82,s*.48);
    target.fillStyle="#685849";
    target.fillRect(x+s*.14,y+s*.44,s*.08,s*.43);
    target.fillRect(x+s*.78,y+s*.44,s*.08,s*.43);

    target.fillStyle="#493a31";
    target.beginPath();
    target.moveTo(x-s*.03,y+s*.42);
    target.lineTo(x+s*.50,y+s*.08);
    target.lineTo(x+s*1.03,y+s*.42);
    target.lineTo(x+s*.91,y+s*.53);
    target.lineTo(x+s*.09,y+s*.53);
    target.closePath();target.fill();

    target.strokeStyle="rgba(152,112,76,.32)";
    target.lineWidth=Math.max(1,s*.022);
    for(let i=0;i<5;i++){
      const yy=y+s*(.23+i*.055);
      target.beginPath();target.moveTo(x+s*.14,yy);target.lineTo(x+s*.86,yy+s*.01);target.stroke();
    }

    target.fillStyle="#554033";
    target.fillRect(x+s*.42,y+s*.61,s*.18,s*.26);
    target.fillStyle="#879076";
    target.fillRect(x+s*.68,y+s*.58,s*.10,s*.10);
  }else if(type==="shrine"){
    target.fillStyle="rgba(37,30,24,.18)";
    target.beginPath();target.ellipse(x+s*.50,y+s*.80,s*.33,s*.09,0,0,Math.PI*2);target.fill();
    target.fillStyle="#75463a";
    target.fillRect(x+s*.26,y+s*.35,s*.09,s*.48);
    target.fillRect(x+s*.65,y+s*.35,s*.09,s*.48);
    target.fillRect(x+s*.16,y+s*.30,s*.68,s*.09);
    target.fillRect(x+s*.23,y+s*.19,s*.54,s*.07);
    target.fillStyle="#44362e";
    target.fillRect(x+s*.23,y+s*.82,s*.54,s*.06);
  }
}

function buildStaticMapCache(){
  const s=BASE_TILE*STATIC_CACHE_SCALE;
  staticMapCtx.clearRect(0,0,staticMapCanvas.width,staticMapCanvas.height);

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      drawGroundTile(tileAt(x,y),x*s,y*s,s,staticMapCtx,x,y);
    }
  }

  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      drawObject(tileAt(x,y),x*s,y*s,s,staticMapCtx);
    }
  }
}

function visibleWorldRect(s){
  const left=camera.x-cssWidth/(2*s);
  const top=camera.y-cssHeight/(2*s);
  const right=camera.x+cssWidth/(2*s);
  const bottom=camera.y+cssHeight/(2*s);

  return {
    left,
    top,
    clampedLeft:clamp(left,0,MAP_W),
    clampedTop:clamp(top,0,MAP_H),
    clampedRight:clamp(right,0,MAP_W),
    clampedBottom:clamp(bottom,0,MAP_H)
  };
}

function drawStaticMap(s,view){
  const sourceTileSize=BASE_TILE*STATIC_CACHE_SCALE;
  const worldW=view.clampedRight-view.clampedLeft;
  const worldH=view.clampedBottom-view.clampedTop;
  if(worldW<=0||worldH<=0)return;

  ctx.save();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(
    staticMapCanvas,
    view.clampedLeft*sourceTileSize,
    view.clampedTop*sourceTileSize,
    worldW*sourceTileSize,
    worldH*sourceTileSize,
    (view.clampedLeft-view.left)*s,
    (view.clampedTop-view.top)*s,
    worldW*s,
    worldH*s
  );
  ctx.restore();
}

function updateFogTexture(now,force=false){
  if(!force&&now-fogTextureLastUpdate<FOG_TEXTURE_INTERVAL_MS)return;
  if(reduceMotion.matches&&!fogTextureDirty&&!force)return;

  fogTextureLastUpdate=now;
  const pixels=fogTextureImage.data;

  for(let py=0;py<FOG_TEX_H;py++){
    const y0=fogSampleY0[py];
    const y1=fogSampleY1[py];
    const ty=fogSampleTY[py];
    const tileY=Math.floor(py/FOG_GLITCH_CELLS);

    for(let px=0;px<FOG_TEX_W;px++){
      const index=py*FOG_TEX_W+px;
      const dataIndex=index*4+3;
      const tileX=Math.floor(px/FOG_GLITCH_CELLS);
      const tileAlpha=fogCurrent[tileY][tileX];

      let alpha;
      if(!discovered[tileY][tileX]&&tileAlpha>=.995){
        alpha=1;
      }else{
        const x0=fogSampleX0[px];
        const x1=fogSampleX1[px];
        const tx=fogSampleTX[px];
        const top=fogCurrent[y0][x0]+(fogCurrent[y0][x1]-fogCurrent[y0][x0])*tx;
        const bottom=fogCurrent[y1][x0]+(fogCurrent[y1][x1]-fogCurrent[y1][x0])*tx;
        alpha=top+(bottom-top)*ty;

        if(!reduceMotion.matches&&alpha>.01&&alpha<.98){
          alpha+=Math.sin(now*fogPulseSpeed[index]+fogPulsePhase[index])*FOG_CELL_PULSE_AMPLITUDE;
        }

        if(tileAlpha>.01&&tileAlpha<.985&&fogBlockBias[index]>0){
          const pulse=reduceMotion.matches
            ?0
            :Math.sin(now*fogPulseSpeed[index]*.82+fogPulsePhase[index]*1.37)*FOG_BLOCK_PULSE_AMPLITUDE;
          const blockAlpha=clamp(fogBlockBias[index]+pulse,0,.075);
          alpha=alpha+(1-alpha)*blockAlpha;
        }
      }

      pixels[dataIndex]=Math.round(clamp(alpha,0,1)*255);
    }
  }

  fogTextureCtx.putImageData(fogTextureImage,0,0);
  fogTextureDirty=false;
}

function drawFogTexture(s,view){
  const worldW=view.clampedRight-view.clampedLeft;
  const worldH=view.clampedBottom-view.clampedTop;
  if(worldW<=0||worldH<=0)return;

  ctx.save();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(
    fogTextureCanvas,
    view.clampedLeft*FOG_GLITCH_CELLS,
    view.clampedTop*FOG_GLITCH_CELLS,
    worldW*FOG_GLITCH_CELLS,
    worldH*FOG_GLITCH_CELLS,
    (view.clampedLeft-view.left)*s,
    (view.clampedTop-view.top)*s,
    worldW*s,
    worldH*s
  );
  ctx.restore();
}

function drawMap(now){
  const s=BASE_TILE*zoom;
  const view=visibleWorldRect(s);

  ctx.fillStyle="#f2efe6";
  ctx.fillRect(0,0,cssWidth,cssHeight);
  drawStaticMap(s,view);
  drawInspect(s);
  drawPlayer(s);
  updateFogTexture(now);
  drawFogTexture(s,view);
}

function drawInspect(s){
  if(!inspectTile)return;
  const p=tileToScreen(inspectTile.x,inspectTile.y);
  ctx.save();
  ctx.strokeStyle="rgba(76,66,52,.66)";
  ctx.lineWidth=Math.max(1.2,s*.035);
  ctx.setLineDash([Math.max(3,s*.12),Math.max(2,s*.07)]);
  ctx.strokeRect(p.x+2,p.y+2,s-4,s-4);
  ctx.restore();
}

function drawPlayer(s){
  const p=tileToScreen(player.renderX,player.renderY);
  const x=p.x+s*.5;
  const y=p.y+s*.54;
  ctx.save();

  ctx.fillStyle="rgba(46,37,29,.18)";
  ctx.beginPath();ctx.ellipse(x,y+s*.27,s*.18,s*.07,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#2e2c2a";
  roundedRect(x-s*.12,y-s*.10,s*.24,s*.30,s*.06);ctx.fill();

  ctx.fillStyle="#6f5943";
  ctx.fillRect(x-s*.105,y+s*.14,s*.07,s*.17);
  ctx.fillRect(x+s*.035,y+s*.14,s*.07,s*.17);

  ctx.fillStyle="#d6b18a";
  ctx.beginPath();ctx.arc(x,y-s*.20,s*.13,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#332b25";
  ctx.beginPath();
  ctx.arc(x,y-s*.235,s*.135,Math.PI,Math.PI*2);
  ctx.lineTo(x+s*.12,y-s*.18);
  ctx.lineTo(x-s*.12,y-s*.18);
  ctx.closePath();ctx.fill();

  const dir={
    north:[0,-1],south:[0,1],west:[-1,0],east:[1,0]
  }[player.facing];
  ctx.fillStyle="#e6d39c";
  ctx.beginPath();
  ctx.arc(x+dir[0]*s*.07,y-s*.18+dir[1]*s*.025,Math.max(1.1,s*.025),0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function updateHud(){
  coordEl.textContent=`${player.x}, ${player.y}`;
  facingEl.textContent=({north:"北",south:"南",west:"西",east:"东"})[player.facing];

  let explored=0;
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(discovered[y][x])explored++;
    }
  }
  explorationEl.textContent=Math.round(explored/(MAP_W*MAP_H)*100)+"%";

  if(inspectTile){
    inspectNameEl.textContent=isDiscovered(inspectTile.x,inspectTile.y)
      ?TILE_INFO[tileAt(inspectTile.x,inspectTile.y)].name
      :"未发现";
    inspectCoordEl.textContent=`${inspectTile.x}, ${inspectTile.y}`;
  }
}

function startMove(nx,ny){
  if(player.moving||!canWalk(nx,ny))return false;
  const dx=nx-player.x;
  const dy=ny-player.y;
  if(Math.abs(dx)+Math.abs(dy)!==1)return false;

  if(dx<0)player.facing="west";
  else if(dx>0)player.facing="east";
  else if(dy<0)player.facing="north";
  else if(dy>0)player.facing="south";

  player.fromX=player.x;
  player.fromY=player.y;
  player.toX=nx;
  player.toY=ny;
  player.x=nx;
  player.y=ny;
  updateVision();
  player.moveStart=performance.now();
  player.moving=true;
  updateHud();

  if(MOVE_MS===0){
    player.renderX=nx;
    player.renderY=ny;
    player.moving=false;
  }
  return true;
}

function directionStep(dx,dy){
  player.path.length=0;
  if(player.moving)return;
  const nx=player.x+dx;
  const ny=player.y+dy;
  if(!startMove(nx,ny)){
    if(dx<0)player.facing="west";
    else if(dx>0)player.facing="east";
    else if(dy<0)player.facing="north";
    else if(dy>0)player.facing="south";
    updateHud();
  }
}

function findPath(sx,sy,tx,ty){
  if(!isDiscovered(tx,ty)||!canWalk(tx,ty))return [];
  const key=(x,y)=>y*MAP_W+x;
  const queue=[[sx,sy]];
  const prev=new Map();
  prev.set(key(sx,sy),null);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

  for(let qi=0;qi<queue.length;qi++){
    const [x,y]=queue[qi];
    if(x===tx&&y===ty)break;
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H||prev.has(k)||!isDiscovered(nx,ny)||!canWalk(nx,ny))continue;
      prev.set(k,[x,y]);
      queue.push([nx,ny]);
    }
  }

  if(!prev.has(key(tx,ty)))return [];
  const result=[];
  let cur=[tx,ty];
  while(cur&&!(cur[0]===sx&&cur[1]===sy)){
    result.push(cur);
    cur=prev.get(key(cur[0],cur[1]));
  }
  return result.reverse();
}

function handleKey(event){
  const mapKey={
    ArrowUp:[0,-1],KeyW:[0,-1],
    ArrowDown:[0,1],KeyS:[0,1],
    ArrowLeft:[-1,0],KeyA:[-1,0],
    ArrowRight:[1,0],KeyD:[1,0]
  };
  const dir=mapKey[event.code];
  if(dir){
    event.preventDefault();
    directionStep(dir[0],dir[1]);
  }else if(event.code==="Escape"){
    player.path.length=0;
    inspectTile={x:player.x,y:player.y};
    updateHud();
  }
}
addEventListener("keydown",handleKey,{passive:false});

function showZoom(){
  zoomFlash.textContent=Math.round(targetZoom*100)+"%";
  zoomFlash.dataset.visible="true";
  clearTimeout(zoomTimer);
  zoomTimer=setTimeout(()=>{zoomFlash.dataset.visible="false"},420);
}

window.addEventListener("wheel",event=>{
  event.preventDefault();
  event.stopPropagation();
  const direction=Math.sign(event.deltaY);
  targetZoom=clamp(targetZoom-direction*.10,ZOOM_MIN,ZOOM_MAX);
  showZoom();
},{passive:false,capture:true});

document.addEventListener("contextmenu",event=>{
  event.preventDefault();
  event.stopPropagation();
},{capture:true});

canvas.addEventListener("pointerdown",event=>{
  const target=screenToTile(event.clientX,event.clientY);
  if(target.x<0||target.y<0||target.x>=MAP_W||target.y>=MAP_H)return;

  if(event.button===2){
    event.preventDefault();
    player.path.length=0;
    inspectTile=target;
    const dx=target.x-player.x;
    const dy=target.y-player.y;
    if(Math.abs(dx)>Math.abs(dy)){
      player.facing=dx<0?"west":"east";
    }else if(dy!==0){
      player.facing=dy<0?"north":"south";
    }
    updateHud();
    return;
  }

  if(event.button===0){
    inspectTile=target;
    player.path=findPath(player.x,player.y,target.x,target.y);
    updateHud();
  }
});

function tick(now){
  if(player.moving&&MOVE_MS>0){
    const t=clamp((now-player.moveStart)/MOVE_MS,0,1);
    const eased=1-Math.pow(1-t,3);
    player.renderX=player.fromX+(player.toX-player.fromX)*eased;
    player.renderY=player.fromY+(player.toY-player.fromY)*eased;
    if(t>=1){
      player.renderX=player.toX;
      player.renderY=player.toY;
      player.moving=false;
    }
  }

  if(!player.moving&&player.path.length){
    const next=player.path.shift();
    startMove(next[0],next[1]);
  }

  zoom+=(targetZoom-zoom)*.18;
  if(Math.abs(targetZoom-zoom)<.001)zoom=targetZoom;

  const targetCameraX=player.renderX+.5;
  const targetCameraY=player.renderY+.5;
  camera.x+=(targetCameraX-camera.x)*.18;
  camera.y+=(targetCameraY-camera.y)*.18;

  updateFogTransition(now);
  const drawStarted=performance.now();
  drawMap(now);
  const drawMs=performance.now()-drawStarted;
  updatePerformanceHud(now,drawMs);
  requestAnimationFrame(tick);
}

function movePointer(event){
  if(!finePointer.matches)return;
  pointer.style.left=`${event.clientX}px`;
  pointer.style.top=`${event.clientY}px`;
  pointer.dataset.visible="true";
}
function hidePointer(){pointer.dataset.visible="false"}
function wobblePointer(){
  if(!finePointer.matches||reduceMotion.matches)return;
  pointerShape.classList.remove("is-wobbling");
  void pointerShape.offsetWidth;
  pointerShape.classList.add("is-wobbling");
}

window.addEventListener("pointermove",movePointer,{passive:true});
window.addEventListener("pointerenter",movePointer,{passive:true});
document.documentElement.addEventListener("pointerleave",hidePointer);
window.addEventListener("blur",hidePointer);
window.addEventListener("pointerdown",wobblePointer);
pointerShape.addEventListener("animationend",()=>pointerShape.classList.remove("is-wobbling"));

initializeFogTexturePattern();
buildStaticMapCache();
updateVision({animate:true});
updateFogTexture(performance.now(),true);

if(visualCheck){
  pointer.style.display="block";
  pointer.style.left="64%";
  pointer.style.top="42%";
  pointer.dataset.visible="true";
  inspectTile={x:9,y:10};
}

if(perfCheck){
  let perfDirection=-1;
  setInterval(()=>{
    if(player.moving)return;
    if(player.y<=14)perfDirection=1;
    if(player.y>=18)perfDirection=-1;
    directionStep(0,perfDirection);
  },260);
}

updateHud();
requestAnimationFrame(tick);
</script>
</body>
</html>
