<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Apprentice</title>
<style>
*{box-sizing:border-box}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  min-height:100vh;
  overflow:hidden;
}

.pointer{
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
  width:24px;
  height:26px;
  pointer-events:none;
  opacity:0;
  transform:translate3d(-2.4px,-1.8px,0);
  transform-origin:2.4px 1.8px;
  scale:1;
  will-change:transform,opacity,scale;
  transition:
    opacity 90ms ease-out,
    scale 90ms cubic-bezier(.23,1,.32,1);
}

.pointer[data-visible="true"]{opacity:1}
.pointer[data-pressed="true"]{scale:.92}

.pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

@media (hover:hover) and (pointer:fine){
  html,
  body{cursor:none}
}

@media (hover:none),(pointer:coarse){
  .pointer{display:none}
}

@media (prefers-reduced-motion:reduce){
  .pointer{transition:none}
}
</style>
</head>
<body>
<div class="pointer" id="pointer" aria-hidden="true">
  <svg viewBox="0 0 24 26" role="presentation" focusable="false">
    <path
      d="M3.18 1.34
         C2.34 1.14 1.55 1.88 1.71 2.77
         L5.48 23.20
         C5.67 24.24 6.88 24.67 7.67 23.96
         L21.03 18.91
         C21.99 18.55 22.20 17.29 21.37 16.70
         L4.65 1.78
         C4.24 1.46 3.69 1.27 3.18 1.34
         Z"
      fill="#fff"
    />
  </svg>
</div>

<script>
const pointer=document.querySelector("#pointer");
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");

function movePointer(event){
  if(!finePointer.matches)return;
  pointer.style.left=`${event.clientX}px`;
  pointer.style.top=`${event.clientY}px`;
  pointer.dataset.visible="true";
}

window.addEventListener("pointermove",movePointer,{passive:true});
window.addEventListener("pointerenter",movePointer,{passive:true});
window.addEventListener("pointerleave",()=>{
  pointer.dataset.visible="false";
});
window.addEventListener("pointerdown",()=>{
  if(finePointer.matches)pointer.dataset.pressed="true";
});
window.addEventListener("pointerup",()=>{
  pointer.dataset.pressed="false";
});
window.addEventListener("pointercancel",()=>{
  pointer.dataset.pressed="false";
});
</script>
</body>
</html>
