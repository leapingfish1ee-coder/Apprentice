<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Apprentice</title>
<style>
*{box-sizing:border-box}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  min-height:100vh;
  overflow:hidden;
}

.pointer{
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
  width:30px;
  height:30px;
  pointer-events:none;
  opacity:0;
  transform:translate3d(-2.6px,-2.2px,0);
  transform-origin:2.6px 2.2px;
  scale:1;
  will-change:transform,opacity,scale;
  transition:
    opacity 90ms ease-out,
    scale 90ms cubic-bezier(.23,1,.32,1);
}

.pointer[data-visible="true"]{opacity:1}
.pointer[data-pressed="true"]{scale:.92}

.pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
}

@media (hover:hover) and (pointer:fine){
  html,
  body{cursor:none}
}

@media (hover:none),(pointer:coarse){
  .pointer{display:none}
}

@media (prefers-reduced-motion:reduce){
  .pointer{transition:none}
}
</style>
</head>
<body>
<div class="pointer" id="pointer" aria-hidden="true">
  <svg viewBox="0 0 30 30" role="presentation" focusable="false">
    <defs>
      <linearGradient id="woodBase" x1="1" y1="2" x2="28" y2="27" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#d0a06a"/>
        <stop offset=".24" stop-color="#a96f3e"/>
        <stop offset=".5" stop-color="#7d4a29"/>
        <stop offset=".72" stop-color="#9a6034"/>
        <stop offset="1" stop-color="#5f351f"/>
      </linearGradient>

      <linearGradient id="edgeLight" x1="2" y1="2" x2="25" y2="25" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f0c993" stop-opacity=".7"/>
        <stop offset=".45" stop-color="#c28a53" stop-opacity=".16"/>
        <stop offset="1" stop-color="#2f180f" stop-opacity=".5"/>
      </linearGradient>

      <radialGradient id="knot" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#3d2015" stop-opacity=".78"/>
        <stop offset=".4" stop-color="#704027" stop-opacity=".56"/>
        <stop offset=".72" stop-color="#ad7040" stop-opacity=".14"/>
        <stop offset="1" stop-color="#cf9b62" stop-opacity="0"/>
      </radialGradient>

      <filter id="woodNoise" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".045 .22" numOctaves="2" seed="17" result="noise"/>
        <feColorMatrix
          in="noise"
          type="matrix"
          values="
            .42 0 0 0 .08
            .18 0 0 0 .03
            .06 0 0 0 .01
            0 0 0 .24 0"
          result="tinted"
        />
        <feBlend in="SourceGraphic" in2="tinted" mode="multiply"/>
      </filter>

      <clipPath id="tenonClip">
        <path d="M4.35 1.45
                 C3.25 1.12 2.16 1.83 2.02 2.94
                 L3.72 20.88
                 C3.86 22.42 4.75 23.72 6.14 24.38
                 L20.68 28.18
                 C22.14 28.56 23.66 27.86 24.35 26.52
                 L28.12 18.92
                 C28.78 17.63 28.53 16.04 27.49 15.04
                 L6.16 2.12
                 C5.66 1.8 4.99 1.57 4.35 1.45
                 Z"/>
      </clipPath>
    </defs>

    <g clip-path="url(#tenonClip)">
      <rect width="30" height="30" fill="url(#woodBase)"/>
      <rect width="30" height="30" fill="url(#edgeLight)" opacity=".55"/>
      <rect width="30" height="30" filter="url(#woodNoise)" opacity=".72"/>

      <g fill="none" stroke-linecap="round">
        <path d="M-1 7 C5 5, 11 8, 18 10 S27 11, 32 9"
              stroke="#e0b37c" stroke-opacity=".34" stroke-width=".7"/>
        <path d="M-2 10 C5 8, 10 11, 17 13 S26 14, 32 12"
              stroke="#4d2b1c" stroke-opacity=".5" stroke-width=".85"/>
        <path d="M-2 13 C4 11, 10 14, 16 16 S25 17, 32 15"
              stroke="#d8a56c" stroke-opacity=".28" stroke-width=".65"/>
        <path d="M0 17 C6 15, 12 17, 18 20 S25 21, 31 19"
              stroke="#4a2819" stroke-opacity=".46" stroke-width=".8"/>
        <path d="M2 21 C8 19, 13 21, 19 23 S25 25, 30 23"
              stroke="#c88c52" stroke-opacity=".28" stroke-width=".7"/>
      </g>

      <ellipse cx="18.4" cy="17.3" rx="4.6" ry="3.1"
               transform="rotate(24 18.4 17.3)"
               fill="url(#knot)"/>
      <ellipse cx="18.4" cy="17.3" rx="2.2" ry="1.35"
               transform="rotate(24 18.4 17.3)"
               fill="none" stroke="#3c2116" stroke-opacity=".52" stroke-width=".65"/>
      <ellipse cx="18.4" cy="17.3" rx="3.35" ry="2.2"
               transform="rotate(24 18.4 17.3)"
               fill="none" stroke="#c98b54" stroke-opacity=".2" stroke-width=".55"/>
    </g>

    <path d="M4.35 1.45
             C3.25 1.12 2.16 1.83 2.02 2.94
             L3.72 20.88
             C3.86 22.42 4.75 23.72 6.14 24.38
             L20.68 28.18
             C22.14 28.56 23.66 27.86 24.35 26.52
             L28.12 18.92
             C28.78 17.63 28.53 16.04 27.49 15.04
             L6.16 2.12
             C5.66 1.8 4.99 1.57 4.35 1.45
             Z"
          fill="none"
          stroke="#2b170f"
          stroke-width="1.15"
          stroke-linejoin="round"/>

    <path d="M4.62 2.75
             C3.92 2.54 3.28 3.02 3.29 3.72
             L4.83 20.48
             C4.92 21.45 5.48 22.24 6.36 22.67
             L20.52 26.45"
          fill="none"
          stroke="#f0c58f"
          stroke-opacity=".42"
          stroke-width=".65"
          stroke-linecap="round"/>
  </svg>
</div>

<script>
const pointer=document.querySelector("#pointer");
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");

function movePointer(event){
  if(!finePointer.matches)return;
  pointer.style.left=`${event.clientX}px`;
  pointer.style.top=`${event.clientY}px`;
  pointer.dataset.visible="true";
}

window.addEventListener("pointermove",movePointer,{passive:true});
window.addEventListener("pointerenter",movePointer,{passive:true});
window.addEventListener("pointerleave",()=>{
  pointer.dataset.visible="false";
});
window.addEventListener("pointerdown",()=>{
  if(finePointer.matches)pointer.dataset.pressed="true";
});
window.addEventListener("pointerup",()=>{
  pointer.dataset.pressed="false";
});
window.addEventListener("pointercancel",()=>{
  pointer.dataset.pressed="false";
});
</script>
</body>
</html>
