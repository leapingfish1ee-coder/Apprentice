<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Apprentice</title>
<style>
*{box-sizing:border-box}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#f2efe6;
}

body{
  min-height:100vh;
  overflow:hidden;
}

.pointer{
  position:fixed;
  top:0;
  left:0;
  z-index:9999;
  width:32px;
  height:32px;
  pointer-events:none;
  opacity:0;
  transform:translate3d(-2.8px,-2.5px,0);
  transform-origin:2.8px 2.5px;
  scale:1;
  will-change:transform,opacity,scale;
  transition:
    opacity 90ms ease-out,
    scale 90ms cubic-bezier(.23,1,.32,1);
}

.pointer[data-visible="true"]{opacity:1}
.pointer[data-pressed="true"]{scale:.92}

.pointer svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  filter:
    drop-shadow(0 1px .7px rgba(50,31,20,.35))
    drop-shadow(0 2px 2px rgba(50,31,20,.12));
}

@media (hover:hover) and (pointer:fine){
  html,
  body{cursor:none}
}

@media (hover:none),(pointer:coarse){
  .pointer{display:none}
}

@media (prefers-reduced-motion:reduce){
  .pointer{transition:none}
}
</style>
</head>
<body>
<div class="pointer" id="pointer" aria-hidden="true">
  <svg viewBox="0 0 32 32" role="presentation" focusable="false">
    <!--
      Wood texture: Poly Haven / Fine Grained Wood / CC0
      https://polyhaven.com/a/fine_grained_wood
    -->
    <defs>
      <path id="tenonShape"
        d="M4.50 1.65
           C3.18 1.31 2.02 2.18 1.98 3.48
           L3.80 21.76
           C3.96 23.44 4.95 24.84 6.50 25.50
           L21.64 29.48
           C23.38 29.93 25.17 29.13 25.97 27.52
           L29.72 19.68
           C30.41 18.25 30.10 16.52 28.91 15.47
           L6.30 2.32
           C5.78 2.01 5.09 1.77 4.50 1.65
           Z"/>

      <clipPath id="tenonClip">
        <use href="#tenonShape"/>
      </clipPath>

      <linearGradient id="warmTint" x1="2" y1="2" x2="29" y2="29" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#efc892" stop-opacity=".40"/>
        <stop offset=".28" stop-color="#c98e58" stop-opacity=".10"/>
        <stop offset=".62" stop-color="#684126" stop-opacity=".05"/>
        <stop offset="1" stop-color="#2f1b11" stop-opacity=".46"/>
      </linearGradient>

      <linearGradient id="chamferTop" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff0cf" stop-opacity=".62"/>
        <stop offset=".42" stop-color="#e5b77e" stop-opacity=".18"/>
        <stop offset="1" stop-color="#7a4d2f" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="chamferDark" x1="8" y1="8" x2="29" y2="29" gradientUnits="userSpaceOnUse">
        <stop offset=".38" stop-color="#4c2b1b" stop-opacity="0"/>
        <stop offset=".76" stop-color="#2c180f" stop-opacity=".28"/>
        <stop offset="1" stop-color="#1b0f0a" stop-opacity=".66"/>
      </linearGradient>

      <filter id="microRelief" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency=".16 .52" numOctaves="2" seed="9" result="grain"/>
        <feColorMatrix
          in="grain"
          type="matrix"
          values="
            .18 0 0 0 .06
            .08 0 0 0 .02
            .03 0 0 0 .01
            0 0 0 .16 0"
          result="grainTint"/>
        <feBlend in="SourceGraphic" in2="grainTint" mode="multiply"/>
      </filter>
    </defs>

    <g clip-path="url(#tenonClip)">
      <rect width="32" height="32" fill="#875635"/>

      <image
        href="https://cdn.polyhaven.com/asset_img/thumbs/fine_grained_wood.png?height=256&amp;quality=95"
        x="-8"
        y="-4"
        width="54"
        height="40"
        preserveAspectRatio="xMidYMid slice"
        transform="rotate(27 16 16)"
      />

      <rect width="32" height="32" fill="url(#warmTint)"/>
      <rect width="32" height="32" fill="url(#chamferTop)"/>
      <rect width="32" height="32" fill="url(#chamferDark)"/>
      <rect width="32" height="32" filter="url(#microRelief)" opacity=".36"/>

      <path
        d="M1.6 8.0 C7.1 6.2 12.8 8.3 18.2 10.7 S27 13.3 32 11.4"
        fill="none"
        stroke="#f0c893"
        stroke-opacity=".22"
        stroke-width=".62"
        stroke-linecap="round"
      />
      <path
        d="M1.0 14.6 C6.9 12.7 12.3 15.4 18.0 17.0 S26.0 20.0 31.4 18.1"
        fill="none"
        stroke="#3b2116"
        stroke-opacity=".36"
        stroke-width=".70"
        stroke-linecap="round"
      />
      <path
        d="M2.7 21.5 C8.5 19.7 13.7 22.0 19.2 23.8 S25.6 26.3 29.0 25.4"
        fill="none"
        stroke="#e0aa70"
        stroke-opacity=".20"
        stroke-width=".58"
        stroke-linecap="round"
      />

      <ellipse
        cx="19.9"
        cy="18.9"
        rx="3.8"
        ry="2.3"
        transform="rotate(27 19.9 18.9)"
        fill="#341c12"
        fill-opacity=".26"
      />
      <ellipse
        cx="19.9"
        cy="18.9"
        rx="2.15"
        ry="1.18"
        transform="rotate(27 19.9 18.9)"
        fill="none"
        stroke="#e4ad73"
        stroke-opacity=".20"
        stroke-width=".50"
      />
    </g>

    <use
      href="#tenonShape"
      fill="none"
      stroke="#3b2116"
      stroke-width="1.05"
      stroke-linejoin="round"
    />

    <path
      d="M4.72 2.77
         C3.93 2.57 3.24 3.10 3.24 3.91
         L4.86 20.98
         C4.96 22.07 5.64 22.94 6.63 23.40
         L21.02 27.20"
      fill="none"
      stroke="#f1cc98"
      stroke-opacity=".48"
      stroke-width=".62"
      stroke-linecap="round"
    />

    <path
      d="M27.88 16.54
         C28.58 17.18 28.75 18.13 28.32 19.03
         L24.64 26.73
         C24.21 27.60 23.31 28.05 22.35 27.81"
      fill="none"
      stroke="#23130d"
      stroke-opacity=".72"
      stroke-width=".72"
      stroke-linecap="round"
    />
  </svg>
</div>

<script>
const pointer=document.querySelector("#pointer");
const finePointer=matchMedia("(hover: hover) and (pointer: fine)");

function movePointer(event){
  if(!finePointer.matches)return;
  pointer.style.left=`${event.clientX}px`;
  pointer.style.top=`${event.clientY}px`;
  pointer.dataset.visible="true";
}

window.addEventListener("pointermove",movePointer,{passive:true});
window.addEventListener("pointerenter",movePointer,{passive:true});
window.addEventListener("pointerleave",()=>{
  pointer.dataset.visible="false";
});
window.addEventListener("pointerdown",()=>{
  if(finePointer.matches)pointer.dataset.pressed="true";
});
window.addEventListener("pointerup",()=>{
  pointer.dataset.pressed="false";
});
window.addEventListener("pointercancel",()=>{
  pointer.dataset.pressed="false";
});
</script>
</body>
</html>
